# Builds an installable Android debug APK from the mobile/ folder. Manual only (Actions tab > "Build Android APK" > Run workflow).
# Separate from the GitHub Pages workflow: it does not deploy or change the website.
name: Build Android APK
on: workflow_dispatch
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - run: ./gradlew assembleDebug
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: Scan-Learn-Act-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
