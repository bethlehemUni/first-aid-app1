خدم ضغطات البطن للرضيع أبدًا. نستخدم الضربات على الظهر والضغطات على الصدر بإصبعين."},{id:"q3",topicId:"bleeding",level:"easy",question:"جرح ينزف بغزارة. ما أهم إجراء أولي بعد الاتصال بالإسعاف؟",options:["الضغط المباشر على الجرح بقماش نظيف","غسل الجرح مرارًا لرؤية عمقه","وضع قهوة أو طحين على الجرح"],answer:0,explanation:"الضغط المباشر والمستمر هو الأساس لإيقاف النزيف. لا ترفع القماش لتتفقد الجرح، وأضف قماشًا فوقه إن تشبّع."},{id:"q4",topicId:"fainting",level:"medium",question:"أُغمي على زميلك ثم استجاب ويتنفس طبيعيًا. ماذا تفعل؟",options:["أجلسه فورًا وأعطيه ماءً","أرقِده وأرفع ساقيه قليلًا وأدعه ينهض ببطء لاحقًا","أصفعه على وجهه ليستيقظ تمامًا"],answer:1,explanation:"الاستلقاء ورفع الساقين يساعد على عودة الدم للدماغ. لا تدعه ينهض بسرعة ولا تعطه شيئًا بالفم حتى يستيقظ تمامًا."},{id:"q5",topicId:"unconscious",level:"easy",question:"شخص لا يستجيب لندائك. ما الخطوة التالية بعد التأكد من سلامة المكان ومناداته؟",options:["أرشّ الماء على وجهه وأنتظر","أعطيه سكرًا ليستعيد وعيه","أتصل بالإسعاف 101 وأراقب تنفسه"],answer:2,explanation:"الشخص غير المستجيب يحتاج مساعدة طبية. لا تعطِ فاقد الوعي أي شيء بالفم، وراقب تنفسه حتى وصول الإسعاف."},{id:"q6",topicId:"unconscious",level:"medium",question:"فاقد الوعي لكنه يتنفس طبيعيًا ولا تشك بإصابة في الرقبة أو الظهر. ما الوضعية المناسبة؟",options:["على جنبه (وضعية الإفاقة)","جالسًا مسنودًا إلى الحائط","واقفًا مع حمله من تحت ذراعيه"],answer:0,explanation:"وضعية الإفاقة تبقي مجرى الهواء مفتوحًا وتمنع انسداده باللسان أو القيء."},{id:"q7",topicId:"hypoglycemia",level:"medium",question:"مريض سكري واعٍ ويبتلع بأمان، وتظهر عليه رجفة وتعرّق وجوع شديد. ماذا تعطيه؟",options:["مشروب دايت خالٍ من السكر","عصير أو أقراص جلوكوز","أي دواء موجود في حقيبته"],answer:1,explanation:"السكر سريع المفعول (نحو 20 غرامًا) مناسب للواعي الذي يبتلع بأمان. المشروبات الخالية من السكر لا تفيد، ولا تُعطى الأدوية."},{id:"q8",topicId:"hypoglycemia",level:"medium",question:"مريض سكري فقد وعيه. ما الصحيح؟",options:["أضع السكر في فمه بحذر","أتصل بالإسعاف 101 ولا أضع شيئًا في فمه","أنتظر ساعة ليستيقظ بنفسه"],answer:1,explanation:"لا يُعطى شيء بالفم لفاقد الوعي لأنه قد يختنق. اتصل بالإسعاف وضعه على جنبه إن كان يتنفس."},{id:"q9",topicId:"dizziness",level:"easy",question:"شعر زميلك بدوخة شديدة بعد الوقوف السريع. ما التصرف الأنسب؟",options:["أدعه يجلس أو يستلقي فورًا","أطلب منه الاستمرار بالمشي ليتحسن","أعطيه مسكّنًا من عندي"],answer:0,explanation:"الجلوس أو الاستلقاء فورًا يمنع السقوط والإصابة. لا تعطه أدوية، وراجع الطبيب إن تكررت الدوخة."},{id:"q10",topicId:"burns",level:"easy",question:"سُكب ماء ساخن على يد طالب. ما أول خطوة؟",options:["وضع الثلج على الحرق","تبريد الحرق بماء جارٍ بارد 10 إلى 20 دقيقة","دهن الحرق بمعجون أسنان"],answer:1,explanation:"الماء الجاري البارد هو الإجراء الصحيح. الثلج والمعجون والزيوت والعلاجات الشعبية تضر الجلد."},{id:"q11",topicId:"fractures",level:"medium",question:"اشتباه بكسر في الساق بعد سقوط. ما الصحيح؟",options:["أحاول إعادة العظم إلى مكانه","أدعم الطرف دون تحريكه وأطلب المساعدة","أطلب منه المشي ليتأكد من الإصابة"],answer:1,explanation:"لا تحاول إعادة العظم ولا تحرّك الطرف. ادعمه في وضعه واطلب المساعدة، وضع كمادة باردة ملفوفة بقماش."},{id:"q12",topicId:"seizures",level:"easy",question:"أثناء نوبة تشنج لدى شخص، ما الذي لا يجب فعله؟",options:["وضع شيء لين تحت رأسه","إبعاد الأشياء الخطرة عنه","وضع ملعقة أو أصابعك في فمه"],answer:2,explanation:"لا يوضع أي شيء في فم المصاب أثناء التشنج لأنه قد يسبب اختناقًا أو إصابة. نحمي رأسه ونبعد الأخطار ولا نقيّد حركته."},{id:"q13",topicId:"seizures",level:"medium",question:"متى نتصل بالإسعاف أثناء تشنج؟",options:["إذا استمر 5 دقائق أو أكثر","فقط إذا أصبح لونه أحمر","لا نتصل أبدًا، فهي تنتهي وحدها دائمًا"],answer:0,explanation:"التشنج الذي يطول 5 دقائق أو أكثر حالة طارئة. وكذلك إذا لم يستيقظ بعده أو كان أول تشنج له أو أصيب أثناءه."},{id:"q14",topicId:"heat",level:"medium",question:"شخص متعب من الحر أصبح مشوّشًا وجلده ساخن جدًا. ما التصنيف والتصرف؟",options:["إرهاق بسيط، يكفي أن يشرب شايًا ساخنًا","ضربة حرارة محتملة: اتصل بالإسعاف وابدأ التبريد","لا شيء، سيتحسن بالنوم"],answer:1,explanation:"التشوّش مع حرارة عالية علامة ضربة حرارة وهي حالة طارئة. اتصل بالإسعاف وابدأ التبريد فورًا."},{id:"q15",topicId:"anaphylaxis",level:"easy",question:"بعد لسعة نحلة ظهر لدى شخص تورّم في الوجه وصعوبة في التنفس. ما أول إجراء؟",options:["الانتظار ساعة لمعرفة هل يتحسن","الاتصال بالإسعاف 101 فورًا","إعطاؤه شرابًا دافئًا"],answer:1,explanation:"هذه حساسية مفرطة محتملة وتتطور بسرعة. اتصل فورًا وساعده على استخدام حقنته الموصوفة إن وُجدت."},{id:"q16",topicId:"wounds",level:"easy",question:"جرح بسيط في الركبة. ما العناية الصحيحة؟",options:["شطفه بماء جارٍ نظيف ثم تغطيته بضمادة نظيفة","سكب الكحول داخل الجرح","وضع الطحين عليه"],answer:0,explanation:"الشطف بماء جارٍ نظيف ثم التغطية هو الأساس. تجنّب الكحول والماء الأكسجيني داخل الجرح والعلاجات الشعبية."},{id:"q17",topicId:"nosebleed",level:"medium",question:"كيف تتعامل مع رعاف بسيط؟",options:["أستلقي وأُميل رأسي للخلف","أجلس وأُميل رأسي للأمام وأضغط على الجزء الليّن من الأنف 10 إلى 15 دقيقة","أحشو الأنف بقطن عميقًا"],answer:1,explanation:"إمالة الرأس للأمام تمنع بلع الدم. الضغط المتواصل على الجزء الليّن من الأنف 10 إلى 15 دقيقة يوقف النزيف غالبًا."},{id:"q18",topicId:"poisoning",level:"easy",question:"طفل ابتلع منظفًا منزليًا. ما الصحيح؟",options:["أجعله يتقيأ بإعطائه ماءً مالحًا","أتصل بالإسعاف 101 فورًا وأحتفظ بالعبوة","أنتظر ظهور الأعراض"],answer:1,explanation:"لا يجوز تحفيز القيء ولا إعطاء ترياق عشوائي. اتصل فورًا واحتفظ بالعبوة لتسليمها للمسعفين."},{id:"q19",topicId:"eye",level:"easy",question:"دخلت مادة كيميائية في عين زميلك. ما أول إجراء؟",options:["فرك العين بقوة","شطف العين بماء جارٍ نظيف لمدة 15–20 دقيقة","تغطيتها دون غسلها"],answer:1,explanation:"الشطف الفوري والطويل بالماء الجاري يخفف أثر المادة. اطلب الإسعاف أثناء الغسل."},{id:"q20",topicId:"eye",level:"hard",question:"جسم صغير عالق داخل العين بعد حادث. ما الصحيح؟",options:["أسحبه بملقط","لا أمسّه ولا أضغط على العين، وأحميها وأتصل بالإسعاف","أغسل العين بقوة بالماء"],answer:1,explanation:"الجسم العالق أو الإصابة النافذة لا تُلمس ولا تُغسل. نحمي العين بكوب نظيف ونطلب المساعدة فورًا."},{id:"q21",topicId:"cpr",level:"easy",question:"شخص لا يستجيب ولا يتنفس، أو يشهق شهقات متقطعة فقط. ما التصرف الصحيح؟",options:["أنتظر بضع دقائق لأرى هل يتحسن","أتصل بالإسعاف 101 وأبدأ الضغطات على الصدر فورًا","أعطيه ماءً ليستعيد وعيه"],answer:1,explanation:"الشهقات المتقطعة ليست تنفسًا طبيعيًا. الاتصال بالإسعاف والبدء بالضغطات فورًا يزيد فرصة النجاة، والانتظار يضيّعها."},{id:"q22",topicId:"cpr",level:"hard",question:"ما معدل ضغطات الصدر ومقدار العمق التقريبي عند الإنعاش للبالغ؟",options:["40 إلى 60 ضغطة في الدقيقة وبعمق 1 سم","100 إلى 120 ضغطة في الدقيقة وبعمق نحو 5 سم","150 إلى 200 ضغطة في الدقيقة وبعمق 10 سم"],answer:1,explanation:"الضغط القوي والسريع (100–120 في الدقيقة، بعمق نحو 5 سم ولا يزيد عن 6 سم) مع ترك الصدر يعود بين الضغطات."},{id:"q23",topicId:"cpr",level:"medium",question:"وصل جهاز AED إلى مكان المصاب. ما الصحيح؟",options:["أشغّله وأتبع تعليماته الصوتية","أنتظر حتى يصل المسعفون دون أن أستخدمه","أضعه جانبًا وأستمر دون استخدامه"],answer:0,explanation:"جهاز AED يرشدك خطوة بخطوة بصوته. شغّله فورًا والصق اللاصقتين، وابتعد عن المصاب أثناء التحليل والصدمة."},{id:"q24",topicId:"cpr",level:"hard",question:"شخص كان يختنق ثم فقد وعيه. ما التصرف؟",options:["أنزله على الأرض وأتصل بالإسعاف وأبدأ الضغطات، وأنظر في فمه وأخرج الجسم إن رأيته","أستمر بضغطات البطن وهو على الأرض","أدخل أصابعي عميقًا في حلقه لأبحث عن الجسم"],answer:0,explanation:"عند فقدان الوعي نبدأ الإنعاش بالضغطات. ننظر في الفم ونُخرج الجسم الغريب فقط إن كان ظاهرًا، ولا نبحث بالأصابع عشوائيًا."},{id:"q25",topicId:"cpr",level:"hard",question:"رضيع (أقل من سنة) لا يستجيب ولا يتنفس. كيف تكون ضغطات الصدر؟",options:["إصبعان في منتصف الصدر بعمق نحو 4 سم وبمعدل 100 إلى 120 في الدقيقة","كعب اليد في منتصف الصدر بعمق نحو 5 سم","ضغطات البطن بقبضة اليد"],answer:0,explanation:"للرضيع نستخدم إصبعين في منتصف الصدر (أو الإبهامين مع تطويق الصدر) بعمق نحو ثلث عمق الصدر، أي نحو 4 سم، وبنفس المعدل 100–120 في الدقيقة."},{id:"q26",topicId:"choking",level:"hard",question:"سيدة حامل تختنق ولا تستطيع الكلام. أين نضع القبضة عند الضغط؟",options:["فوق السرّة مباشرة كما في أي شخص","في منتصف عظمة الصدر بدل البطن","على أعلى الظهر بين لوحَي الكتف فقط"],answer:1,explanation:"عند الحمل أو إذا تعذّر تطويق البطن نضع القبضة في منتصف عظمة الصدر ونضغط إلى الداخل، بدل ضغطات البطن."},{id:"q27",topicId:"bleeding",level:"hard",question:"أثناء الضغط على جرح ينزف، تشبّعت قطعة القماش بالدم. ما الصحيح؟",options:["أرفعها وأضع قطعة جديدة مكانها","أضع قطعة أخرى فوقها وأزيد الضغط دون إزالة الأولى","أتوقف عن الضغط وأنتظر"],answer:1,explanation:"رفع القماش يزيل الجلطة التي بدأت تتكوّن ويزيد النزيف. نضيف قماشًا فوق الأول ونواصل الضغط."},{id:"q28",topicId:"hypoglycemia",level:"hard",question:"أعطيت مريض سكري واعيًا سكرًا بسبب انخفاض السكر. ما الخطوة التالية؟",options:["أعطيه كمية أكبر فورًا دون انتظار","أنتظر نحو 15 دقيقة وأراقبه، وأتصل بالإسعاف إن لم يتحسن","أتركه وحده لأنه تحسن"],answer:1,explanation:"ننتظر نحو 15 دقيقة ونراقب حالته. إن لم يتحسّن نتصل بالإسعاف 101، ولا نتركه وحده."},{id:"q29",topicId:"fractures",level:"hard",question:"كيف تُستخدم الكمادة الباردة عند اشتباه كسر؟",options:["ثلج مباشرة على الجلد لمدة ساعة","ملفوفة بقماش جاف رقيق، حتى 20 دقيقة، وتتوقف إن زاد الألم","كمادة ساخنة لتخفيف الألم"],answer:1,explanation:"الكمادة الباردة تخفف الألم والتورم لكن تُلفّ بقماش ولا توضع على الجلد مباشرة، وتُستخدم حتى 20 دقيقة وتُترك 20 دقيقة قبل إعادتها."},{id:"q30",topicId:"cpr",level:"hard",question:"تحتاج طفلًا إلى صدمة من جهاز AED ولا توجد لاصقات أطفال. ما التصرف؟",options:["أستخدم لاصقات البالغين ولا أؤخر الصدمة","أنتظر حتى أجد لاصقات أطفال","لا أستخدم الجهاز مع الأطفال أبدًا"],answer:0,explanation:"إن توفرت لاصقات أطفال فنستخدمها، وإن لم تتوفر نستخدم لاصقات البالغين ولا نؤخر الصدمة."}];let Xe=null;function Ia(){var e;try{const t=window.AudioContext||window.webkitAudioContext;if(!t)return;(!Xe||Xe.state==="closed")&&(Xe=new t),(e=Xe.resume)==null||e.call(Xe)}catch{}}function Dm(){var e;try{const t=window.AudioContext||window.webkitAudioContext;if(!t)return()=>{};(!Xe||Xe.state==="clo
